# Git hooks (installed by `pnpm install` via the "prepare" script; mirrors GitLab's use of lefthook).
# Keep hooks fast: staged files only on commit; full checks on push.
# Commands call local binaries directly so the hook does not depend on which pnpm is on PATH.

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,cjs,json,yml,yaml,css}"
      run: node_modules/.bin/prettier --write {staged_files} && git add {staged_files}
    eslint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: node_modules/.bin/eslint --max-warnings=0 {staged_files}
    gitleaks:
      run: sh scripts/hooks/gitleaks.sh

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: node_modules/.bin/tsc --noEmit
    unit:
      run: node_modules/.bin/vitest run
