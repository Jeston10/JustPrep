# Git hooks (install: `pnpm dlx lefthook install`; runs automatically via package.json "prepare" once Phase 0 lands).
# Mirrors GitLab's use of lefthook. Keep hooks fast: staged files only on commit; full checks on push.

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,md,yml,yaml,css}"
      run: pnpm prettier --write {staged_files} && git add {staged_files}
    eslint:
      glob: "*.{ts,tsx,js,mjs}"
      run: pnpm eslint --max-warnings=0 {staged_files}
    gitleaks:
      run: pnpm dlx gitleaks protect --staged --redact --verbose

commit-msg:
  commands:
    commitlint:
      run: pnpm dlx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm test
