# CI pipeline. Activated in Phase 0 once pnpm, scripts, and tests exist (docs/IMPLEMENTATION_PLAN.md).
# Until then this workflow is expected to fail on the legacy codebase; do not weaken it to make it pass.
name: CI

# Branching model (PROCESS.md §Branching): PR branch → milestone/* → dev → main.
# The pipeline runs on every PR (any base) and on pushes to the three integration tiers.
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "milestone/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # pnpm version comes from package.json#packageManager (pnpm/action-setup reads it).

jobs:
  static:
    name: Lint · Typecheck · Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec knip
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit · Integration
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - name: Integration (Firestore emulator)
        run: pnpm dlx firebase-tools emulators:exec --only auth,firestore --project demo-justprep "pnpm test:integration"

  build:
    name: Build · Audit · Size
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
      - run: pnpm exec size-limit

  e2e:
    name: E2E · Responsive · A11y
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Demo values: the Firebase web config is public by design and the emulator accepts any project id.
      # Server secrets are absent, so SKIP_ENV_VALIDATION=1; nothing in the e2e suite needs them yet.
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-justprep.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-justprep
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:demo"
          NEXT_PUBLIC_VAPI_WEB_TOKEN: demo
          NEXT_PUBLIC_VAPI_WORKFLOW_ID: demo
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - run: pnpm dlx firebase-tools emulators:exec --only auth,firestore --project demo-justprep "pnpm test:e2e"
        env:
          SKIP_ENV_VALIDATION: "1"
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-justprep.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-justprep
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:demo"
          NEXT_PUBLIC_VAPI_WEB_TOKEN: demo
          NEXT_PUBLIC_VAPI_WORKFLOW_ID: demo
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
