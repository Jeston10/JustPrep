# CI pipeline. Activated in Phase 0 once pnpm, scripts, and tests exist (docs/IMPLEMENTATION_PLAN.md).
# Until then this workflow is expected to fail on the legacy codebase; do not weaken it to make it pass.
name: CI

# Branching model (PROCESS.md §Branching): PR branch → milestone/* → dev → main.
# The pipeline runs on every PR (any base) and on pushes to the three integration tiers.
on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - "milestone/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  # pnpm version comes from package.json#packageManager (pnpm/action-setup reads it).

jobs:
  static:
    name: Lint · Typecheck · Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm dlx knip
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Unit · Integration
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - name: Integration (Firestore emulator)
        run: pnpm dlx firebase-tools emulators:exec --only auth,firestore "pnpm test:integration"
        env:
          FIREBASE_PROJECT_ID: demo-justprep

  build:
    name: Build · Audit · Size
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "1"
      - run: pnpm dlx size-limit

  e2e:
    name: E2E · Responsive · A11y
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx playwright install --with-deps chromium webkit
      - run: pnpm dlx firebase-tools emulators:exec --only auth,firestore "pnpm test:e2e"
        env:
          FIREBASE_PROJECT_ID: demo-justprep
          SKIP_ENV_VALIDATION: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
